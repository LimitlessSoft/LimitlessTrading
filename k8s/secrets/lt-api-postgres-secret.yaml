apiVersion: v1
kind: Secret
metadata:
  name: lt-api-postgres-secret
  namespace: lt-api-namespace
type: Opaque
stringData:
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  ConnectionStrings__DefaultConnection: "Host=lt-api-postgres-service;Port=5432;Database=ltdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
