apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOY_ENV}-lt-api-deployment
  namespace: lt-api-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${DEPLOY_ENV}-lt-api
  template:
    metadata:
      labels:
        app: ${DEPLOY_ENV}-lt-api
    spec:
      containers:
      - name: ${DEPLOY_ENV}-lt-api
        image: limitlesssoft/limitless-trading-api:${DEPLOY_ENV}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: lt-api-postgres-secret
              key: ConnectionStrings__DefaultConnection
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

      imagePullSecrets:
      - name: regcred
