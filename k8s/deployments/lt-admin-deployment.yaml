apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOY_ENV}-lt-admin-deployment
  namespace: lt-admin-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${DEPLOY_ENV}-lt-admin
  template:
    metadata:
      labels:
        app: ${DEPLOY_ENV}-lt-admin
    spec:
      containers:
      - name: ${DEPLOY_ENV}-lt-admin
        image: limitlesssoft/lt-admin:${DEPLOY_ENV}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"

      imagePullSecrets:
      - name: regcred
