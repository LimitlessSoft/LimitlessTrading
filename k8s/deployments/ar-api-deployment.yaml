apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOY_ENV}-ar-api-deployment
  namespace: ar-api-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${DEPLOY_ENV}-ar-api
  template:
    metadata:
      labels:
        app: ${DEPLOY_ENV}-ar-api
    spec:
      containers:
      - name: ${DEPLOY_ENV}-ar-api
        image: limitlesssoft/ar-trading-tools-api:${DEPLOY_ENV}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

      imagePullSecrets:
      - name: regcred
