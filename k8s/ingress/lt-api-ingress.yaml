apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${DEPLOY_ENV}-lt-api-ingress
  namespace: lt-api-namespace
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: api.limitlessworkstation.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${DEPLOY_ENV}-lt-api-service
            port:
              number: 80
