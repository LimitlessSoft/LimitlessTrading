apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lt-api-postgres
  namespace: lt-api-namespace
spec:
  serviceName: lt-api-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: lt-api-postgres
  template:
    metadata:
      labels:
        app: lt-api-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: lt-api-postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lt-api-postgres-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: lt-api-postgres-pvc
