<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
	<!-- LimitlessTrading app icon: an infinity loop whose right lobe breaks out as a rising arrow.
	     Master for the PNG / ICO files next to it. -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#232833" />
			<stop offset="1" stop-color="#15181D" />
		</linearGradient>
		<linearGradient id="line" x1="70" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#4A8FE7" />
			<stop offset="1" stop-color="#26A69A" />
		</linearGradient>
	</defs>
	<rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" />
	<rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="#2C313A" stroke-width="2" />
	<g fill="none" stroke="url(#line)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
		<!-- Left lobe and the right lobe's lower half -->
		<path d="M242,256 C206,212 178,196 150,196 C112,196 88,226 88,268 C88,310 112,340 150,340
		         C190,340 222,312 256,276 C292,318 324,348 362,348 C402,348 424,312 420,268" />
		<!-- Through the centre and up and out of the loop -->
		<path d="M150,340 C190,340 222,312 256,276 C300,226 340,186 404,124" />
		<!-- Arrow head -->
		<path d="M346,118 H412 V184" />
	</g>
</svg>
