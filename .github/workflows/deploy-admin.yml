name: Deploy lt-admin to cluster

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

jobs:
  apply-resources:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
    - uses: actions/checkout@v3

    - name: Set K8s context
      uses: ossrs/k8s-set-context-action@v1
      with:
        kubeconfig: '${{ secrets.KUBE_CONFIG_PURE }}'

    - name: Deploy lt-admin to cluster
      run: |-
        export DEPLOY_ENV=${{ inputs.env }}
        envsubst < k8s/namespaces/lt-admin-namespace.yaml | kubectl apply -f -
        envsubst < k8s/services/lt-admin-service.yaml | kubectl apply -f -
        envsubst < k8s/deployments/lt-admin-deployment.yaml | kubectl apply -f -
        envsubst < k8s/ingress/lt-admin-ingress.yaml | kubectl apply -f -
        kubectl rollout restart -n lt-admin-namespace deployment ${{ inputs.env }}-lt-admin-deployment
