name: Release

# A version tag (v0.1.0) builds the app and publishes a GitHub Release with it. A manual run
# builds the same archive as a workflow artifact, without a release.
# Linux only for now, framework-dependent (needs the .NET 10 runtime): LSCore's DI scan loads every
# *.dll in the app folder, which crashes on the runtime's own DLLs in a self-contained build and on
# native DLLs in a Windows one (docs/architecture.md). macOS is untested.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # v0.1.0 -> 0.1.0; manual runs get a dev version
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Offline: the tests use fakes, never IB
      - name: Test
        run: dotnet test LimitlessTrading.slnx -c Release

      # Framework-dependent and not single-file: LSCore's DI scan loads the app's assemblies from
      # the folder and can't handle the runtime's own DLLs there
      - name: Publish
        run: >
          dotnet publish src/LT.App/LT.App.csproj -c Release -r linux-x64 --self-contained false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/LimitlessTrading

      - name: Package
        run: tar -C publish -czf LimitlessTrading-${{ steps.version.outputs.version }}-linux-x64.tar.gz LimitlessTrading

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimitlessTrading-${{ steps.version.outputs.version }}-linux-x64
          path: LimitlessTrading-${{ steps.version.outputs.version }}-linux-x64.tar.gz

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LimitlessTrading-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          generate_release_notes: true
