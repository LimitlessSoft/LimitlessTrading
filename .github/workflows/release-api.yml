name: Release production limitless-trading-api

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'src/LimitlessTrading/LimitlessTrading.Public/LT.Public.Api/**'
      - 'k8s/deployments/lt-api-deployment.yaml'
      - 'k8s/services/lt-api-service.yaml'
      - 'k8s/services/lt-api-postgres-service.yaml'
      - 'k8s/ingress/lt-api-ingress.yaml'
      - 'k8s/namespaces/lt-api-namespace.yaml'
      - 'k8s/secrets/lt-api-postgres-secret.yaml'
      - 'k8s/storage/lt-api-postgres-pvc.yaml'
      - 'k8s/statefulsets/lt-api-postgres-statefulset.yaml'
      - 'scripts/set-api-version.js'
      - '.github/workflows/deploy-api.yml'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch version
        run: node scripts/set-api-version.js

      - name: Read new version
        id: read
        run: echo "version=$(grep -oP '(?<=<Version>)[\d.]+(?=<\/Version>)' src/LimitlessTrading/LimitlessTrading.Public/LT.Public.Api/LT.Public.Api/LT.Public.Api.csproj)" >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/LimitlessTrading/LimitlessTrading.Public/LT.Public.Api/LT.Public.Api/LT.Public.Api.csproj
          git commit -m "Bump Public API to ${{ steps.read.outputs.version }}"
          git pull --rebase
          git push

  api:
    needs: bump-version
    uses: LimitlessSoft/LimitlessTrading/.github/workflows/build-and-publish-api.yml@master
    secrets: inherit
    with:
      env: production
