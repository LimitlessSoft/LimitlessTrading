name: Release production ar-trading-tools-api

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'AR.Public.Api/**'
      - 'k8s/deployments/ar-api-deployment.yaml'
      - 'k8s/services/ar-api-service.yaml'
      - 'k8s/ingress/ar-api-ingress.yaml'
      - 'k8s/namespaces/ar-api-namespace.yaml'

jobs:
  api:
    uses: AleksaRistic216/ARAnalysis/.github/workflows/build-and-publish-api.yml@master
    secrets: inherit
    with:
      env: production
