name: Deploy limitless-trading-api to cluster

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

jobs:
  apply-resources:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
    - uses: actions/checkout@v3

    - name: Set K8s context
      uses: ossrs/k8s-set-context-action@v1
      with:
        kubeconfig: '${{ secrets.KUBE_CONFIG_PURE }}'

    - name: Deploy limitless-trading-api to cluster
      run: |-
        export DEPLOY_ENV=${{ inputs.env }}
        export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        export ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
        export ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
        export ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
        envsubst < k8s/namespaces/lt-api-namespace.yaml | kubectl apply -f -
        envsubst < k8s/secrets/lt-api-postgres-secret.yaml | kubectl apply -f -
        envsubst < k8s/secrets/lt-api-admin-secret.yaml | kubectl apply -f -
        kubectl apply -f k8s/storage/lt-api-postgres-pvc.yaml
        kubectl apply -f k8s/storage/lt-api-releases-pvc.yaml
        kubectl apply -f k8s/statefulsets/lt-api-postgres-statefulset.yaml
        kubectl apply -f k8s/services/lt-api-postgres-service.yaml
        envsubst < k8s/services/lt-api-service.yaml | kubectl apply -f -
        envsubst < k8s/deployments/lt-api-deployment.yaml | kubectl apply -f -
        envsubst < k8s/ingress/lt-api-ingress.yaml | kubectl apply -f -
        kubectl rollout restart -n lt-api-namespace deployment ${{ inputs.env }}-lt-api-deployment
