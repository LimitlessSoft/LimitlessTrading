name: Deploy limitless-trading-api to cluster

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

jobs:
  apply-resources:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
    - uses: actions/checkout@v3

    - name: Set K8s context
      uses: ossrs/k8s-set-context-action@v1
      with:
        kubeconfig: '${{ secrets.KUBE_CONFIG_PURE }}'

    - name: Deploy limitless-trading-api to cluster
      run: |-
        export DEPLOY_ENV=${{ inputs.env }}
        envsubst < k8s/namespaces/lt-api-namespace.yaml | kubectl apply -f -
        envsubst < k8s/services/lt-api-service.yaml | kubectl apply -f -
        envsubst < k8s/deployments/lt-api-deployment.yaml | kubectl apply -f -
        envsubst < k8s/ingress/lt-api-ingress.yaml | kubectl apply -f -
        kubectl rollout restart -n lt-api-namespace deployment ${{ inputs.env }}-lt-api-deployment
