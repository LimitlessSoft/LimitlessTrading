name: Deploy ar-trading-tools-api to cluster

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

jobs:
  apply-resources:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
    - uses: actions/checkout@v3

    - name: Set K8s context
      uses: ossrs/k8s-set-context-action@v1
      with:
        kubeconfig: '${{ secrets.KUBE_CONFIG_PURE }}'

    - name: Deploy ar-trading-tools-api to cluster
      run: |-
        export DEPLOY_ENV=${{ inputs.env }}
        envsubst < k8s/namespaces/ar-api-namespace.yaml | kubectl apply -f -
        envsubst < k8s/services/ar-api-service.yaml | kubectl apply -f -
        envsubst < k8s/deployments/ar-api-deployment.yaml | kubectl apply -f -
        envsubst < k8s/ingress/ar-api-ingress.yaml | kubectl apply -f -
        kubectl rollout restart -n ar-api-namespace deployment ${{ inputs.env }}-ar-api-deployment
