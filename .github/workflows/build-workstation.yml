name: Build and release LT Workstation

on:
  workflow_call:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch version
        run: node scripts/set-workstation-version.js

      - name: Read new version
        id: read
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('src/LT.Workstation/version.json','utf8')).version")" >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/LT.Workstation/version.json \
                  src/LT.Workstation/LT.Workstation.App/package.json \
                  src/LT.Workstation/LT.Workstation.Fe/package.json \
                  src/LT.Workstation/LT.Workstation.Server/package.json
          git commit -m "Bump Workstation to ${{ steps.read.outputs.version }}"
          git push

  build-and-release:
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server production dependencies
        working-directory: src/LT.Workstation/LT.Workstation.Server
        run: npm ci --omit=dev

      - name: Install frontend dependencies
        working-directory: src/LT.Workstation/LT.Workstation.Fe
        run: npm ci

      - name: Build frontend
        working-directory: src/LT.Workstation/LT.Workstation.Fe
        run: npm run build

      - name: Install Electron app dependencies
        working-directory: src/LT.Workstation/LT.Workstation.App
        run: npm ci

      - name: Build Electron app
        working-directory: src/LT.Workstation/LT.Workstation.App
        run: npm run dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: workstation-v${{ needs.bump-version.outputs.version }}
          name: LT Workstation v${{ needs.bump-version.outputs.version }}
          generate_release_notes: true
          files: src/LT.Workstation/LT.Workstation.App/dist/*.AppImage
