name: Build and push api docker image, then start deploying action

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

jobs:
  build-and-push-api:
    environment: ${{ inputs.env }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build docker image
      run: docker build --file AR.Public.Api/AR.Public.Api/Dockerfile -t limitlesssoft/ar-trading-tools-api:${{ inputs.env }} AR.Public.Api

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Push docker image
      run: docker push limitlesssoft/ar-trading-tools-api:${{ inputs.env }}

  deploy:
    uses: AleksaRistic216/ARAnalysis/.github/workflows/deploy-api.yml@master
    needs: [ build-and-push-api ]
    secrets: inherit
    with:
      env: ${{ inputs.env }}
